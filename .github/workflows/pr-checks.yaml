name: PR Checks

on:
  pull_request:
    branches: [ main, development ]
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ main ]
  merge_group: 

permissions:
  contents: read
  pull-requests: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 25
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run the build
        run: npm run build