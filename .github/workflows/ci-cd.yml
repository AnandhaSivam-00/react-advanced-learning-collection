# CI/CD - PR Checks, Preview and Production Deployments

name: Run Tasks

on:
  pull_request:
    branches: [ main, development ]
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_BUILD_FOLDER: 'dist'
  CLOUDFLARE_PROJECT_NAME: 'gigles'

jobs:
  ci-checks:
    name: CI Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: read

    outputs:
      lint: ${{ steps.lint.outcome }}
      build: ${{ steps.build.outcome }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020   # v7.0.0
        with:
          node-version: 25
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        id: lint
        run: npm run lint

      - name: Run the build
        id: build
        run: npm run build

      - name: Uploading the build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: 'build-artifact-${{ github.sha }}'
          path: ${{ env.PROJECT_BUILD_FOLDER }}
          if-no-files-found: 'error'
          retention-days: 1

  preview-deploy:
    name: Preview Deployment
    runs-on: ubuntu-latest
    needs: ci-checks

    permissions:
      contents: read
      pull-requests: write
      deployments: write

    if: |
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.body, '[no-preview]')

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0

      - name: Download the build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
        with:
          name: 'build-artifact-${{ github.sha }}'
          path: ${{ env.PROJECT_BUILD_FOLDER }}

      - name: Deploy Preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0   # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ env.PROJECT_BUILD_FOLDER }} --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  production-deploy:
    name: Production Deployment
    runs-on: ubuntu-latest
    needs: ci-checks

    permissions:
      contents: read
      pull-requests: read

    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0

      - name: Download the build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
        with:
          name: 'build-artifact-${{ github.sha }}'
          path: ${{ env.PROJECT_BUILD_FOLDER }}

      - name: Deploy Production to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0   # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ env.PROJECT_BUILD_FOLDER }} --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }} --branch main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [ci-checks, preview-deploy, production-deploy]

    if: always()

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Write a summary of the build inside the Actions and comment on the PR
        run: |
          get_emoji() {
            case "$1" in
              success)   echo "✅ Success" ;;
              failure)   echo "❌ Failure" ;;
              cancelled) echo "⚠️ Cancelled" ;;
              skipped)   echo "⏭️ Skipped" ;;
              *)         echo "❓ Unknown" ;;
            esac
          }

          LINT_RESULT=$(get_emoji "${{ needs.ci-checks.outputs.lint }}")
          BUILD_RESULT=$(get_emoji "${{ needs.ci-checks.outputs.build }}")
          PREVIEW_RESULT=$(get_emoji "${{ needs.preview-deploy.result }}")
          PRODUCTION_RESULT=$(get_emoji "${{ needs.production-deploy.result }}")

          {
            echo "## 🚀 Pipeline Result"
            echo ""
            echo "| Stage | Result |"
            echo "|-------|--------|"
            echo "| 🔍 Lint | ${LINT_RESULT} |"
            echo "| 🏗️ Build | ${BUILD_RESULT} |"
            echo "| 👁️ Preview Deployment | ${PREVIEW_RESULT} |"
            echo "| 🌐 Production Deployment | ${PRODUCTION_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"